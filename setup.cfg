[metadata]
name = frankapp
version = 0.1
description = frankapp. Franka Panda pick & place with RL, from MuJoCo to the real robot.
license = MIT

[options]
include_package_data = True
packages = find:
#packages = frankapp, experiments, tests, tools
python_requires = >= 3.10
install_requires =
    numpy==2.5.3
    mujoco<3.12.0
    gymnasium==1.3.0
    stable-baselines3==2.9.0
    tensorboard==2.21.0
    pyyaml==6.0.3
    matplotlib==3.11.2
    imageio[ffmpeg]==2.37.4
    jax==0.4.30
    jaxlib==0.4.30
    flax==0.10.2
    wandb==0.25.1
    sbx-rl
    gymnasium-robotics==1.2.0

[options.extras_require]
dev =
    ruff
    pytest==9.1.1
gpu =
    jax[cuda12]
robot =
    franky-control

[options.packages.find]
include = frankapp*, experiments*, tests*, tools*, panda_mujoco_gym*

[options.package_data]
panda_mujoco_gym = **/*.xml, **/*.stl, **/*.obj