[metadata]
name = frankapp
version = 0.1
description = frankapp. Franka Panda pick & place with RL, from MuJoCo to the real robot.
license = MIT

[options]
include_package_data = True
packages = find:
python_requires = >= 3.12
install_requires =
    numpy==2.5.3
    mujoco<3.12.0
    gymnasium==1.3.0
    stable-baselines3==2.9.0
    tensorboard==2.21.0
    pyyaml==6.0.3
    matplotlib==3.11.2
    imageio[ffmpeg]==2.37.4
    jax==0.11.2
    flax==0.12.9
    wandb==0.25.1
    sbx-rl==0.28.0
    gymnasium-robotics==1.4.2

[options.extras_require]
dev =
    ruff
    pytest==9.1.1
gpu =
    jax[cuda12]==0.11.2
robot =
    franky-control